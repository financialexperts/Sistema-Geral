<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Marca do Elas: o "ela$" da logo no verde-água em degradê, com a faixa
       branca do "FINANÇAS PARA" em cima -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F6F1"/>
    </linearGradient>
    <linearGradient id="letras" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EAFCB"/>
      <stop offset="1" stop-color="#17C6A3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fundo)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#13B6C0" stroke-opacity=".3"/>
  <rect x="11" y="11.5" width="42" height="8" rx="1.5" fill="#FFFFFF" stroke="#272259" stroke-opacity=".16"/>
  <path d="M15 15.5h34" stroke="#272259" stroke-width="1.5" stroke-dasharray="2.2 1.6" opacity=".75"/>
  <text x="32" y="47" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="-0.6" fill="url(#letras)">ela$</text>
</svg>
